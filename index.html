<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Car Roolet Super Puper</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        :root {
            --bg-color: #0f1015;
            --card-bg: #1a1b22;
            --card-border: #2c2d3a;
            --accent: #f39c12;
            --accent-gradient: linear-gradient(135deg, #f1c40f, #e67e22);
            --text-main: #ffffff;
            --text-muted: #8b8e98;
            --green: #2ecc71;
            --red: #e74c3c;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-main);
            margin: 0;
            padding: 0;
            padding-bottom: 80px;
        }

        /* Шапка профиля */
        .header {
            background: var(--card-bg);
            border-bottom: 1px solid var(--card-border);
            padding: 15px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .profile-info {
            display: flex;
            align-items: center;
            gap: 10px;
        }
        .avatar {
            width: 42px;
            height: 42px;
            background: var(--accent-gradient);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: bold;
            font-size: 18px;
            color: #000;
        }
        .balance-box {
            text-align: right;
        }
        .balance-val {
            font-size: 17px;
            font-weight: bold;
            color: var(--accent);
        }

        /* Контент страниц */
        .page { display: none; padding: 15px; }
        .page.active { display: block; }

        /* Рулетка */
        .category-scroll {
            display: flex;
            gap: 8px;
            overflow-x: auto;
            padding-bottom: 10px;
            margin-bottom: 15px;
        }
        .cat-chip {
            background: var(--card-bg);
            border: 1px solid var(--card-border);
            color: var(--text-muted);
            padding: 8px 14px;
            border-radius: 20px;
            font-size: 13px;
            white-space: nowrap;
            cursor: pointer;
            font-weight: 600;
        }
        .cat-chip.active {
            background: var(--accent);
            color: #000;
            border-color: var(--accent);
        }

        .roulette-container {
            position: relative;
            width: 100%;
            height: 120px;
            background: #14151a;
            border-radius: 16px;
            border: 2px solid var(--card-border);
            overflow: hidden;
            box-shadow: inset 0 0 20px rgba(0,0,0,0.8);
            margin-bottom: 20px;
        }
        .roulette-pointer {
            position: absolute;
            top: 0; bottom: 0; left: 50%;
            width: 4px; background: var(--red);
            transform: translateX(-50%);
            z-index: 10;
            box-shadow: 0 0 10px var(--red);
        }
        .roulette-strip {
            display: flex;
            position: absolute;
            top: 0; left: 0; height: 100%;
            align-items: center;
            will-change: transform;
        }
        .roulette-item {
            min-width: 130px; height: 95px;
            margin: 0 6px;
            background: var(--card-bg);
            border-radius: 12px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            padding: 8px;
            box-sizing: border-box;
            border: 1px solid var(--card-border);
        }
        .item-name { font-size: 13px; font-weight: bold; margin-bottom: 4px; text-align: center; }
        .item-price { font-size: 12px; color: var(--green); font-weight: bold; }

        /* Кнопки */
        .btn-primary {
            background: var(--accent-gradient);
            color: #000;
            border: none;
            padding: 16px;
            border-radius: 14px;
            font-size: 16px;
            font-weight: bold;
            width: 100%;
            cursor: pointer;
            box-shadow: 0 6px 20px rgba(241, 196, 15, 0.3);
            transition: transform 0.1s;
        }
        .btn-primary:active { transform: scale(0.97); }
        .btn-primary:disabled { background: #3a3a3c; color: #8e8e93; box-shadow: none; }

        /* Карточка результата */
        .win-modal {
            background: var(--card-bg);
            border: 1px solid var(--accent);
            border-radius: 16px;
            padding: 20px;
            text-align: center;
            margin-top: 20px;
            display: none;
            animation: fadeIn 0.3s ease;
        }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }

        /* Инвентарь и сейф */
        .item-card {
            background: var(--card-bg);
            border: 1px solid var(--card-border);
            border-radius: 12px;
            padding: 12px;
            margin-bottom: 10px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .item-actions { display: flex; gap: 6px; }
        .action-btn {
            background: #2c2d3a; color: #fff; border: none;
            padding: 8px 12px; border-radius: 8px; font-size: 12px; font-weight: bold; cursor: pointer;
        }
        .action-btn.sell { background: rgba(46, 204, 113, 0.2); color: var(--green); }
        .action-btn.safe { background: rgba(241, 196, 15, 0.2); color: var(--accent); }

        /* Навигация снизу */
        .nav-bar {
            position: fixed; bottom: 0; left: 0; right: 0;
            background: #14151a;
            border-top: 1px solid var(--card-border);
            display: flex;
            justify-content: space-around;
            padding: 10px 0;
            z-index: 100;
        }
        .nav-item {
            background: none; border: none; color: var(--text-muted);
            font-size: 11px; display: flex; flex-direction: column; align-items: center; gap: 4px; cursor: pointer;
        }
        .nav-item.active { color: var(--accent); }
        .nav-icon { font-size: 20px; }
    </style>
</head>
<body>

    <!-- Шапка -->
    <div class="header">
        <div class="profile-info">
            <div class="avatar" id="userAvatar">👑</div>
            <div>
                <div style="font-size: 13px; color: var(--text-muted);">Игрок</div>
                <div id="userName" style="font-size: 15px; font-weight: bold;">Car Driver</div>
            </div>
        </div>
        <div class="balance-box">
            <div style="font-size: 11px; color: var(--text-muted);">Баланс</div>
            <div class="balance-val" id="userBalance">500,000 ₽</div>
        </div>
    </div>

    <!-- СТРАНИЦА 1: РУЛЕТКА -->
    <div id="page-spin" class="page active">
        <h3 style="margin: 0 0 10px 0;">🎰 Выбор рулетки</h3>
        <div class="category-scroll" id="catScroll">
            <div class="cat-chip active" onclick="selectCat('гражданские', 100000, '🚗 Гражданские')">🚗 Гражданские</div>
            <div class="cat-chip" onclick="selectCat('грузовики', 180000, '🚛 Грузовики')">🚛 Грузовики</div>
            <div class="cat-chip" onclick="selectCat('полиция', 250000, '🚔 Полиция')">🚔 Полиция</div>
            <div class="cat-chip" onclick="selectCat('мчс', 200000, '🚒 МЧС')">🚒 МЧС</div>
            <div class="cat-chip" onclick="selectCat('пожарные', 200000, '🔥 Пожарные')">🔥 Пожарные</div>
            <div class="cat-chip" onclick="selectCat('скорая', 150000, '🚑 Скорая')">🚑 Скорая</div>
            <div class="cat-chip" onclick="selectCat('военные', 500000, '🪖 Военные')">🪖 Военные</div>
            <div class="cat-chip" onclick="selectCat('номера', 50000, '🔢 Госномера')">🔢 Госномера</div>
        </div>

        <div class="roulette-container">
            <div class="roulette-pointer"></div>
            <div class="roulette-strip" id="strip"></div>
        </div>

        <button class="btn-primary" id="spinBtn" onclick="startSpin()">Крутить (100,000 ₽)</button>

        <div class="win-modal" id="winModal">
            <div style="font-size: 12px; color: var(--accent); font-weight: bold;">ПОБЕДА 🎉</div>
            <div id="winTitle" style="font-size: 20px; font-weight: bold; margin: 8px 0;">-</div>
            <div id="winPrice" style="font-size: 15px; color: var(--green); font-weight: bold;">-</div>
        </div>
    </div>

    <!-- СТРАНИЦА 2: ИНВЕНТАРЬ -->
    <div id="page-inventory" class="page">
        <h3>🎒 Ваш Инвентарь</h3>
        <div id="inventoryList"><p style="color:var(--text-muted);">Инвентарь пуст...</p></div>
    </div>

    <!-- СТРАНИЦА 3: СЕЙФ -->
    <div id="page-safe" class="page">
        <h3>🔒 Сейф (Защищенные вещи)</h3>
        <div id="safeList"><p style="color:var(--text-muted);">Сейф пуст...</p></div>
    </div>

    <!-- СТРАНИЦА 4: РЕЙТИНГ -->
    <div id="page-rating" class="page">
        <h3>🏆 Топ Игроков</h3>
        <div id="ratingList" style="background:var(--card-bg); border-radius:12px; padding:15px; border:1px solid var(--card-border);">
            <p>1. Вы — 500,000 ₽</p>
        </div>
    </div>

    <!-- Нижняя навигация -->
    <div class="nav-bar">
        <button class="nav-item active" onclick="switchPage('spin', this)">
            <span class="nav-icon">🎰</span> Рулетка
        </button>
        <button class="nav-item" onclick="switchPage('inventory', this)">
            <span class="nav-icon">🎒</span> Инвентарь
        </button>
        <button class="nav-item" onclick="switchPage('safe', this)">
            <span class="nav-icon">🔒</span> Сейф
        </button>
        <button class="nav-item" onclick="switchPage('rating', this)">
            <span class="nav-icon">🏆</span> Рейтинг
        </button>
    </div>

    <script>
        const tg = window.Telegram.WebApp;
        tg.expand();

        let balance = 500000;
        let currentCat = 'гражданские';
        let spinCost = 100000;
        let inventory = [];

        if (tg.initDataUnsafe && tg.initDataUnsafe.user) {
            document.getElementById('userName').innerText = tg.initDataUnsafe.user.first_name || "Игрок";
        }

        const databases = {
            "гражданские": [
                { name: "ВАЗ 2107", price: 150000, weight: 40 },
                { name: "Lada Priora", price: 350000, weight: 30 },
                { name: "Toyota Camry", price: 2800000, weight: 10 },
                { name: "BMW M5 F90", price: 9500000, weight: 3 },
                { name: "Bugatti Chiron", price: 250000000, weight: 0.2 }
            ],
            "грузовики": [
                { name: "ГАЗель NEXT", price: 1800000, weight: 40 },
                { name: "КАМАЗ Самовал", price: 3500000, weight: 25 },
                { name: "MAN TGX", price: 8500000, weight: 10 },
                { name: "Scania R500", price: 11000000, weight: 5 }
            ],
            "полиция": [
                { name: "Полиция Granta", price: 600000, weight: 50 },
                { name: "ДПС Skoda", price: 1800000, weight: 20 },
                { name: "ДПС BMW X5", price: 7000000, weight: 5 }
            ],
            "мчс": [
                { name: "МЧС УАЗ Патриот", price: 1200000, weight: 50 },
                { name: "Пожарный КАМАЗ", price: 8500000, weight: 10 }
            ],
            "пожарные": [
                { name: "ЗИЛ 131 Пожарный", price: 2500000, weight: 50 },
                { name: "Автолестница АЛ-30", price: 6500000, weight: 20 }
            ],
            "скорая": [
                { name: "Скорая ГАЗель", price: 2200000, weight: 50 },
                { name: "Реанимация Ford", price: 4500000, weight: 15 }
            ],
            "военные": [
                { name: "Военный УАЗ", price: 400000, weight: 50 },
                { name: "Броневик Тигр", price: 12000000, weight: 10 },
                { name: "БТР-82А", price: 28000000, weight: 3 }
            ],
            "номера": [
                { name: "Обычный А123АА", price: 5000, weight: 60 },
                { name: "🟦 Полиция 1234", price: 30000, weight: 20 },
                { name: "⬛ Военный номер", price: 25000, weight: 20 },
                { name: "Блатной 777", price: 350000, weight: 2 }
            ]
        };

        function selectCat(cat, cost, title) {
            currentCat = cat;
            spinCost = cost;
            document.querySelectorAll('.cat-chip').forEach(el => el.classList.remove('active'));
            event.target.classList.add('active');
            document.getElementById('spinBtn').innerText = `Крутить (${cost.toLocaleString()} ₽)`;
            initStrip();
        }

        function getRandomItem() {
            const pool = databases[currentCat];
            let total = pool.reduce((sum, item) => sum + item.weight, 0);
            let rnd = Math.random() * total;
            for (let item of pool) {
                if (rnd < item.weight) return item;
                rnd -= item.weight;
            }
            return pool[0];
        }

        const strip = document.getElementById('strip');
        let stripItems = [];

        function initStrip() {
            strip.style.transition = 'none';
            strip.style.transform = 'translateX(0px)';
            strip.innerHTML = '';
            stripItems = [];

            for (let i = 0; i < 50; i++) {
                let item = getRandomItem();
                stripItems.push(item);
                let div = document.createElement('div');
                div.className = 'roulette-item';
                div.innerHTML = `
                    <div class="item-name">${item.name}</div>
                    <div class="item-price">${item.price.toLocaleString()} ₽</div>
                `;
                strip.appendChild(div);
            }
        }
        initStrip();

        function startSpin() {
            if (balance < spinCost) {
                alert("Недостаточно средств на балансе!");
                return;
            }

            balance -= spinCost;
            updateBalanceUI();

            const spinBtn = document.getElementById('spinBtn');
            const winModal = document.getElementById('winModal');
            spinBtn.disabled = true;
            winModal.style.display = 'none';
            initStrip();

            const winIdx = 35;
            const winItem = stripItems[winIdx];
            const itemWidth = 142;
            const targetPos = (winIdx * itemWidth) - 160 + (itemWidth / 2) + ((Math.random() - 0.5) * 30);

            setTimeout(() => {
                strip.style.transition = 'transform 4s cubic-bezier(0.15, 0.85, 0.15, 1)';
                strip.style.transform = `translateX(-${targetPos}px)`;
            }, 50);

            setTimeout(() => {
                document.getElementById('winTitle').innerText = winItem.name;
                document.getElementById('winPrice').innerText = ` + ${winItem.price.toLocaleString()} ₽`;
                winModal.style.display = 'block';
                spinBtn.disabled = false;

                // Добавляем в инвентарь
                inventory.push({ id: Date.now(), ...winItem, inSafe: false });
                renderInventory();

                if (tg && tg.sendData) {
                    tg.sendData(JSON.stringify(winItem));
                }
            }, 4100);
        }

        function updateBalanceUI() {
            document.getElementById('userBalance').innerText = balance.toLocaleString() + ' ₽';
        }

        function switchPage(pageName, btn) {
            document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
            document.querySelectorAll('.nav-item').forEach(n => n.classList.remove('active'));
            document.getElementById('page-' + pageName).classList.add('active');
            btn.classList.add('active');
        }

        function renderInventory() {
            const list = document.getElementById('inventoryList');
            const safeList = document.getElementById('safeList');
            
            const normalItems = inventory.filter(i => !i.inSafe);
            const safeItems = inventory.filter(i => i.inSafe);

            list.innerHTML = normalItems.length === 0 ? '<p style="color:var(--text-muted);">Инвентарь пуст...</p>' : '';
            safeList.innerHTML = safeItems.length === 0 ? '<p style="color:var(--text-muted);">Сейф пуст...</p>' : '';

            normalItems.forEach(item => {
                list.innerHTML += `
                    <div class="item-card">
                        <div>
                            <div style="font-weight:bold; font-size:14px;">${item.name}</div>
                            <div style="color:var(--green); font-size:12px;">${item.price.toLocaleString()} ₽</div>
                        </div>
                        <div class="item-actions">
                            <button class="action-btn safe" onclick="toggleSafe(${item.id})">🔒 В сейф</button>
                            <button class="action-btn sell" onclick="sellItem(${item.id})">Продать</button>
                        </div>
                    </div>
                `;
            });

            safeItems.forEach(item => {
                safeList.innerHTML += `
                    <div class="item-card">
                        <div>
                            <div style="font-weight:bold; font-size:14px;">🛡 ${item.name}</div>
                            <div style="color:var(--accent); font-size:12px;">${item.price.toLocaleString()} ₽</div>
                        </div>
                        <div class="item-actions">
                            <button class="action-btn" onclick="toggleSafe(${item.id})">🔓 Достать</button>
                        </div>
                    </div>
                `;
            });
        }

        function toggleSafe(id) {
            let item = inventory.find(i => i.id === id);
            if (item) {
                item.inSafe = !item.inSafe;
                renderInventory();
            }
        }

        function sellItem(id) {
            let idx = inventory.findIndex(i => i.id === id);
            if (idx !== -1) {
                balance += inventory[idx].price;
                updateBalanceUI();
                inventory.splice(idx, 1);
                renderInventory();
            }
        }
    </script>
</body>
</html>
