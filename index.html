<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Car & Plates Market Universe</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        :root {
            --bg-color: #0b0c10;
            --card-bg: #15171e;
            --card-border: #252836;
            --accent: #f39c12;
            --accent-gradient: linear-gradient(135deg, #f1c40f, #e67e22);
            --text-main: #ffffff;
            --text-muted: #8b8e98;
            --green: #2ecc71;
            --star: #ffd700;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background-color: var(--bg-color); color: var(--text-main);
            margin: 0; padding: 0; padding-bottom: 90px; user-select: none;
        }

        .header {
            background: var(--card-bg); border-bottom: 1px solid var(--card-border);
            padding: 12px 16px; display: flex; justify-content: space-between; align-items: center;
        }
        .profile-info { display: flex; align-items: center; gap: 10px; }
        .avatar {
            width: 40px; height: 40px; background: var(--accent-gradient);
            border-radius: 50%; display: flex; align-items: center; justify-content: center;
            font-weight: bold; color: #000; font-size: 16px;
        }
        .balances { text-align: right; }
        .balance-val { font-size: 15px; font-weight: bold; color: var(--accent); }
        .stars-val { font-size: 13px; font-weight: bold; color: var(--star); }

        .page { display: none; padding: 15px; }
        .page.active { display: block; }

        /* Табы видов номеров и авто */
        .mode-switch {
            display: flex; gap: 6px; margin-bottom: 12px; overflow-x: auto;
            background: var(--card-bg); padding: 4px; border-radius: 12px;
            border: 1px solid var(--card-border); scrollbar-width: none;
        }
        .mode-btn {
            flex: 1; padding: 8px 12px; background: none; border: none;
            color: var(--text-muted); font-weight: bold; border-radius: 8px;
            cursor: pointer; font-size: 12px; white-space: nowrap;
        }
        .mode-btn.active { background: var(--accent); color: #000; }

        /* Рулетка */
        .roulette-container {
            position: relative; width: 100%; height: 150px;
            background: #111319; border-radius: 16px;
            border: 2px solid var(--card-border); overflow: hidden;
            box-shadow: inset 0 0 25px rgba(0,0,0,0.9); margin-bottom: 15px;
        }
        .roulette-pointer {
            position: absolute; top: 0; bottom: 0; left: 50%;
            width: 3px; background: #e74c3c; transform: translateX(-50%);
            z-index: 10; box-shadow: 0 0 12px #e74c3c;
        }
        .roulette-strip { display: flex; position: absolute; top: 0; left: 0; height: 100%; align-items: center; }
        .roulette-item {
            min-width: 140px; height: 130px; margin: 0 6px;
            background: var(--card-bg); border-radius: 12px;
            display: flex; flex-direction: column; justify-content: space-between;
            align-items: center; padding: 8px; box-sizing: border-box;
            border: 1px solid var(--card-border);
        }

        /* Генератор гос. номера с реалистичными стилями */
        .plate-ui {
            background: #fff; color: #000; border: 2px solid #000; border-radius: 5px;
            padding: 3px 8px; font-family: 'Courier New', monospace; font-weight: bold;
            font-size: 13px; display: inline-flex; align-items: center; gap: 6px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.5); letter-spacing: 1px;
        }
        .plate-ui.taxi { background: #ffcc00; color: #000; border-color: #000; }
        .plate-ui.police { background: #0055ff; color: #fff; border-color: #fff; }
        .plate-ui.military { background: #1a1a1a; color: #fff; border-color: #333; }
        .plate-ui .flag-box { border-left: 1px solid #000; padding-left: 4px; font-size: 10px; text-align: center; }

        .btn-primary {
            background: var(--accent-gradient); color: #000; border: none;
            padding: 15px; border-radius: 14px; font-size: 15px; font-weight: bold;
            width: 100%; cursor: pointer; box-shadow: 0 6px 20px rgba(241, 196, 15, 0.3);
        }

        /* Маркетплейс карточки */
        .market-card {
            background: var(--card-bg); border: 1px solid var(--card-border);
            border-radius: 14px; padding: 12px; margin-bottom: 10px;
            display: flex; justify-content: space-between; align-items: center;
        }
        .star-price { color: var(--star); font-weight: bold; font-size: 14px; }

        /* Навигация */
        .nav-bar {
            position: fixed; bottom: 0; left: 0; right: 0; background: #111319;
            border-top: 1px solid var(--card-border); display: flex; justify-content: space-around;
            padding: 10px 0; z-index: 100;
        }
        .nav-item { background: none; border: none; color: var(--text-muted); font-size: 11px; display: flex; flex-direction: column; align-items: center; gap: 3px; cursor: pointer; }
        .nav-item.active { color: var(--accent); }
    </style>
</head>
<body>

    <div class="header">
        <div class="profile-info">
            <div class="avatar" id="userAvatar">👑</div>
            <div>
                <div id="userName" style="font-size: 14px; font-weight: bold;">Гонщик</div>
            </div>
        </div>
        <div class="balances">
            <div class="balance-val" id="userBalance">500,000 ₽</div>
            <div class="stars-val" id="userStars">⭐ 10 Stars</div>
        </div>
    </div>

    <!-- РУЛЕТКА -->
    <div id="page-spin" class="page active">
        <div class="mode-switch">
            <button class="mode-btn active" onclick="setMode('cars')">🚗 Автомобили</button>
            <button class="mode-btn" onclick="setMode('civil_plates')">⚪ Гражданские</button>
            <button class="mode-btn" onclick="setMode('taxi_plates')">🟡 Такси</button>
            <button class="mode-btn" onclick="setMode('police_plates')">🔵 Полиция</button>
            <button class="mode-btn" onclick="setMode('military_plates')">⚫ Военные</button>
        </div>

        <div class="roulette-container">
            <div class="roulette-pointer"></div>
            <div class="roulette-strip" id="strip"></div>
        </div>

        <button class="btn-primary" id="spinBtn" onclick="startSpin()">Крутить (100,000 ₽)</button>

        <!-- АНИМАЦИЯ ВЫПАДЕНИЯ НОМЕРА -->
        <div id="plateAnimModal" style="display:none; text-align:center; margin-top:15px; background:var(--card-bg); padding:15px; border-radius:14px; border:1px solid var(--accent);">
            <div style="font-size:12px; color:var(--text-muted);">ГЕНЕРАЦИЯ ГОС. НОМЕРА...</div>
            <div id="animPlateBox" style="margin:10px 0;"></div>
            <div id="animPlatePrice" style="color:var(--green); font-weight:bold;"></div>
        </div>
    </div>

    <!-- ИНВЕНТАРЬ -->
    <div id="page-inventory" class="page">
        <h3 style="margin-top:0;">🎒 Ваш Гараж и Номера</h3>
        <div id="inventoryList"></div>
    </div>

    <!-- АВТОРЫНОК (P2P MARKETPLACE) -->
    <div id="page-market" class="page">
        <h3 style="margin-top:0;">🏪 Рынок Номеров и Авто (за ⭐)</h3>
        <p style="font-size:11px; color:var(--text-muted);">Комиссия площадки: 1 ⭐ с продажи забирает Сервер!</p>
        <div id="marketList"></div>
    </div>

    <!-- Навигация -->
    <div class="nav-bar">
        <button class="nav-item active" onclick="switchPage('spin', this)"><span>🎰</span>Рулетка</button>
        <button class="nav-item" onclick="switchPage('inventory', this)"><span>🎒</span>Гараж</button>
        <button class="nav-item" onclick="switchPage('market', this)"><span>🏪</span>Авторынок</button>
    </div>

    <script>
        const tg = window.Telegram.WebApp;
        tg.expand();

        let user = { balance: 500000, stars: 10 };
        let mode = 'cars';
        let inventory = [];
        
        // Рынок объявление
        let marketItems = [
            { id: 901, seller: "Олигарх", title: "BMW M5 F90", plate: "О777ОО 77", priceStars: 5, type: "car" },
            { id: 902, seller: "Влад", title: "Красивый номер", plate: "Х777ХХ 159", priceStars: 2, type: "plate" }
        ];

        const letters = "АВЕКМНОРСТУХ";
        const regions = ["59", "159", "77", "777", "199", "102", "16"];

        function generateRandomPlate(type) {
            let l1 = letters[Math.floor(Math.random()*letters.length)];
            let l2 = letters[Math.floor(Math.random()*letters.length)];
            let l3 = letters[Math.floor(Math.random()*letters.length)];
            let num = Math.floor(Math.random()*899 + 100);
            let reg = regions[Math.floor(Math.random()*regions.length)];

            if (type === 'civil_plates') {
                const isRare = Math.random() < 0.1;
                if(isRare) num = "777";
                return { str: `${l1}${num}${l2}${l3} ${reg}`, style: 'civil', price: isRare ? 500000 : 30000 };
            } else if (type === 'taxi_plates') {
                return { str: `${l1}${l2} ${Math.floor(Math.random()*89+10)} ${reg}`, style: 'taxi', price: 40000 };
            } else if (type === 'police_plates') {
                return { str: `А ${Math.floor(Math.random()*8999+1000)} ${reg}`, style: 'police', price: 150000 };
            } else if (type === 'military_plates') {
                return { str: `${Math.floor(Math.random()*8999+1000)} ${l1}${l2}`, style: 'military', price: 80000 };
            }
        }

        function renderPlateHTML(str, styleClass) {
            return `<div class="plate-ui ${styleClass}">${str} <span class="flag-box">RUS</span></div>`;
        }

        function setMode(m) {
            mode = m;
            document.querySelectorAll('.mode-btn').forEach(b => b.classList.remove('active'));
            event.target.classList.add('active');
            initStrip();
        }

        const strip = document.getElementById('strip');
        let stripItems = [];

        function initStrip() {
            strip.style.transition = 'none';
            strip.style.transform = 'translateX(0px)';
            strip.innerHTML = '';
            stripItems = [];

            for (let i = 0; i < 35; i++) {
                let item = {};
                if (mode === 'cars') {
                    item = { name: "ВАЗ 2107", price: 150000, img: "https://upload.wikimedia.org/wikipedia/commons/thumb/1/18/Lada_2107_izh.jpg/320px-Lada_2107_izh.jpg" };
                } else {
                    let p = generateRandomPlate(mode);
                    item = { name: "Гос. Номер", plateStr: p.str, style: p.style, price: p.price };
                }
                stripItems.push(item);

                let div = document.createElement('div');
                div.className = 'roulette-item';
                div.innerHTML = mode === 'cars' 
                    ? `<div style="font-size:11px; font-weight:bold;">${item.name}</div><img src="${item.img}" style="width:70px;"><div style="color:var(--green); font-size:11px;">${item.price.toLocaleString()} ₽</div>`
                    : `<div style="font-size:10px;">НОМЕР</div>${renderPlateHTML(item.plateStr, item.style)}<div style="color:var(--green); font-size:11px;">${item.price.toLocaleString()} ₽</div>`;
                strip.appendChild(div);
            }
        }

        function startSpin() {
            if (user.balance < 100000) return alert("❌ Недостаточно средств!");
            user.balance -= 100000;
            updateUI();

            const spinBtn = document.getElementById('spinBtn');
            spinBtn.disabled = true;
            initStrip();

            const winIdx = 22;
            const winItem = stripItems[winIdx];
            const targetPos = (winIdx * 152) - 140;

            setTimeout(() => {
                strip.style.transition = 'transform 3.5s cubic-bezier(0.15, 0.85, 0.15, 1)';
                strip.style.transform = `translateX(-${targetPos}px)`;
            }, 50);

            setTimeout(() => {
                spinBtn.disabled = false;
                if (mode !== 'cars') {
                    // Анимация бегающих букв на номере!
                    const modal = document.getElementById('plateAnimModal');
                    const box = document.getElementById('animPlateBox');
                    modal.style.display = 'block';
                    
                    let interval = setInterval(() => {
                        let tempP = generateRandomPlate(mode);
                        box.innerHTML = renderPlateHTML(tempP.str, tempP.style);
                    }, 80);

                    setTimeout(() => {
                        clearInterval(interval);
                        box.innerHTML = renderPlateHTML(winItem.plateStr, winItem.style);
                        document.getElementById('animPlatePrice').innerText = `Оценка: ${winItem.price.toLocaleString()} ₽`;
                        inventory.push({ id: Date.now(), type: 'plate', title: winItem.plateStr, style: winItem.style, price: winItem.price });
                        renderInventory();
                    }, 1500);
                } else {
                    inventory.push({ id: Date.now(), type: 'car', title: winItem.name, price: winItem.price, plate: null });
                    renderInventory();
                    alert(`🎉 Вы выбили автомобиль: ${winItem.name}!`);
                }
            }, 3600);
        }

        function attachPlateToCar(plateId) {
            let cars = inventory.filter(i => i.type === 'car');
            if (cars.length === 0) return alert("❌ У вас нет автомобилей в гараже!");
            
            let plateIdx = inventory.findIndex(i => i.id === plateId);
            let plate = inventory[plateIdx];

            let targetCar = cars[0]; // Ставим на первую авто
            targetCar.plate = plate.title;
            targetCar.price += plate.price; // ПОВЫШАЕМ СТОИМОСТЬ МАШИНЫ!

            inventory.splice(plateIdx, 1);
            renderInventory();
            alert(`✅ Номер ${plate.title} успешно установлен на ${targetCar.title}! Стоимость машины выросла до ${targetCar.price.toLocaleString()} ₽!`);
        }

        function sellOnMarket(id) {
            let item = inventory.find(i => i.id === id);
            let stars = prompt("Введите цену в ⭐ Stars для продажи на авторынке (Минимум 2 ⭐):", "2");
            stars = parseInt(stars);

            if (stars >= 2) {
                marketItems.push({
                    id: Date.now(),
                    seller: "Вы",
                    title: item.title,
                    plate: item.plate || item.title,
                    priceStars: stars,
                    type: item.type
                });
                inventory = inventory.filter(i => i.id !== id);
                renderInventory();
                renderMarket();
                alert(`🏪 Выставлено на продажу за ${stars} ⭐! При покупке 1 ⭐ пойдет тебе, а 1 ⭐ — комиссии серверу.`);
            }
        }

        function buyFromMarket(marketId) {
            let idx = marketItems.findIndex(m => m.id === marketId);
            let item = marketItems[idx];

            if (user.stars < item.priceStars) return alert("❌ Недостаточно ⭐ Stars!");

            user.stars -= item.priceStars;
            // 1 звезда тебе как владельцу, остальное продавцу
            alert(`🎉 Куплено! 1 ⭐ ушла в комиссию проекта!`);
            marketItems.splice(idx, 1);
            updateUI();
            renderMarket();
        }

        function renderInventory() {
            const list = document.getElementById('inventoryList');
            list.innerHTML = inventory.length === 0 ? '<p style="color:var(--text-muted);">Пусто...</p>' : '';
            inventory.forEach(item => {
                list.innerHTML += `
                    <div style="background:var(--card-bg); border:1px solid var(--card-border); border-radius:12px; padding:10px; margin-bottom:8px; display:flex; justify-content:space-between; align-items:center;">
                        <div>
                            <div style="font-weight:bold;">${item.title} ${item.plate ? `(${item.plate})` : ''}</div>
                            <div style="color:var(--green); font-size:12px;">${item.price.toLocaleString()} ₽</div>
                        </div>
                        <div>
                            ${item.type === 'plate' ? `<button onclick="attachPlateToCar(${item.id})" style="background:var(--accent); border:none; padding:5px 8px; border-radius:6px; font-weight:bold; cursor:pointer;">🔗 На авто</button>` : ''}
                            <button onclick="sellOnMarket(${item.id})" style="background:none; border:1px solid var(--star); color:var(--star); padding:5px 8px; border-radius:6px; cursor:pointer;">Продать за ⭐</button>
                        </div>
                    </div>
                `;
            });
        }

        function renderMarket() {
            const list = document.getElementById('marketList');
            list.innerHTML = '';
            marketItems.forEach(m => {
                list.innerHTML += `
                    <div class="market-card">
                        <div>
                            <div style="font-weight:bold;">${m.title}</div>
                            <div style="font-size:11px; color:var(--text-muted);">Продавец: ${m.seller}</div>
                        </div>
                        <div style="text-align:right;">
                            <div class="star-price">⭐ ${m.priceStars} Stars</div>
                            <button onclick="buyFromMarket(${m.id})" style="background:var(--star); color:#000; border:none; padding:6px 10px; border-radius:6px; font-weight:bold; cursor:pointer; margin-top:4px;">Купить</button>
                        </div>
                    </div>
                `;
            });
        }

        function updateUI() {
            document.getElementById('userBalance').innerText = user.balance.toLocaleString() + ' ₽';
            document.getElementById('userStars').innerText = `⭐ ${user.stars} Stars`;
        }

        function switchPage(pageName, btn) {
            document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
            document.querySelectorAll('.nav-item').forEach(n => n.classList.remove('active'));
            document.getElementById('page-' + pageName).classList.add('active');
            if(btn) btn.classList.add('active');
        }

        initStrip();
        renderMarket();
    </script>
</body>
</html>
