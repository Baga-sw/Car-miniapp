<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>Песочные Сокровища</title>
  <!-- Telegram WebApp SDK -->
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <style>
    :root {
      --bg-color: #1c1815;
      --card-bg: #2a2420;
      --accent-color: #f39c12;
      --text-color: #f1f2f6;
    }

    body {
      margin: 0;
      padding: 15px;
      background-color: var(--bg-color);
      color: var(--text-color);
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      user-select: none;
      -webkit-user-select: none;
    }

    /* Верхняя панель статистики */
    .stats-bar {
      display: flex;
      justify-content: space-between;
      width: 100%;
      max-width: 360px;
      margin-bottom: 15px;
      background: var(--card-bg);
      padding: 10px 15px;
      border-radius: 12px;
      box-sizing: border-box;
      box-shadow: 0 4px 10px rgba(0,0,0,0.3);
    }

    .stat-item {
      font-size: 14px;
      font-weight: bold;
    }

    .stat-value {
      color: var(--accent-color);
    }

    /* Игровое поле */
    .grid-container {
      display: grid;
      grid-template-columns: repeat(5, 1fr);
      gap: 8px;
      width: 100%;
      max-width: 360px;
      height: 360px;
      margin-bottom: 15px;
    }

    .cell {
      background-color: #d4a373; /* Цвет песка */
      border-radius: 8px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 24px;
      cursor: pointer;
      transition: transform 0.1s, background-color 0.3s;
      position: relative;
      box-shadow: inset -2px -2px 0px rgba(0,0,0,0.2);
    }

    .cell:active {
      transform: scale(0.95);
    }

    .cell.dug {
      background-color: #3d312a; /* Откопанная земля */
      box-shadow: inset 2px 2px 5px rgba(0,0,0,0.5);
      cursor: default;
    }

    /* Рамки редкости для найденных предметов */
    .item-common { border: 2px solid #a4b0be; }
    .item-rare { border: 2px solid #1e90ff; }
    .item-epic { border: 2px solid #a55eea; }
    .item-legendary { border: 2px solid #ffa502; box-shadow: 0 0 10px #ffa502; }

    /* Панель инвентаря и действий */
    .controls {
      width: 100%;
      max-width: 360px;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .btn {
      background-color: var(--accent-color);
      color: #000;
      border: none;
      padding: 12px;
      border-radius: 10px;
      font-weight: bold;
      font-size: 16px;
      cursor: pointer;
      text-align: center;
      transition: opacity 0.2s;
    }

    .btn:active {
      opacity: 0.8;
    }

    /* Всплывающее уведомление о находке */
    .modal {
      position: fixed;
      top: 0; left: 0; right: 0; bottom: 0;
      background: rgba(0,0,0,0.8);
      display: none;
      align-items: center;
      justify-content: center;
      z-index: 100;
    }

    .modal-content {
      background: var(--card-bg);
      padding: 20px;
      border-radius: 16px;
      text-align: center;
      max-width: 280px;
      width: 100%;
    }

    .modal-icon { font-size: 50px; margin-bottom: 10px; }
    .modal-title { font-size: 18px; margin-bottom: 5px; font-weight: bold; }
    .modal-rarity { font-size: 12px; margin-bottom: 15px; text-transform: uppercase; }
  </style>
</head>
<body>

  <!-- Шапка со статистикой -->
  <div class="stats-bar">
    <div class="stat-item">💰 Монеты: <span id="coins" class="stat-value">0</span></div>
    <div class="stat-item">⚡ Энергия: <span id="energy" class="stat-value">10/10</span></div>
  </div>

  <!-- Сетка $5 \times 5$ с песком -->
  <div class="grid-container" id="grid"></div>

  <!-- Кнопки управления -->
  <div class="controls">
    <button class="btn" onclick="resetGrid()">🧹 Очистить поле (Новый раскоп)</button>
  </div>

  <!-- Модальное окно для находок -->
  <div class="modal" id="modal">
    <div class="modal-content">
      <div class="modal-icon" id="modal-icon">📦</div>
      <div class="modal-title" id="modal-title">Название предмета</div>
      <div class="modal-rarity" id="modal-rarity">Редкость</div>
      <div style="margin-bottom: 15px;">Ценность: <span id="modal-value" style="color:#f39c12">0</span> монет</div>
      <button class="btn" onclick="closeModal()">Забрать в багаж</button>
    </div>
  </div>

  <script>
    // Инициализация Telegram WebApp API
    const tg = window.Telegram?.WebApp;
    if (tg) {
      tg.expand(); // Разворачиваем приложение на весь экран
      tg.ready();
    }

    // Состояние игры
    let coins = 0;
    let energy = 10;
    const maxEnergy = 10;
    const gridSize = 25; // 5x5 сетка

    // Таблица лута с вероятностями
    const lootTable = [
      { name: "Ржавый гвоздь", icon: "📌", rarity: "Обычный", type: "common", value: 5, chance: 0.35 },
      { name: "Пивная крышка", icon: "🪙", rarity: "Обычный", type: "common", value: 10, chance: 0.25 },
      { name: "Серебряная монета", icon: "🥈", rarity: "Редкий", type: "rare", value: 50, chance: 0.20 },
      { name: "Старинные часы", icon: "⌚", rarity: "Редкий", type: "rare", value: 120, chance: 0.10 },
      { name: "Золотой кубок", icon: "🏆", rarity: "Эпический", type: "epic", value: 300, chance: 0.07 },
      { name: "Бриллиант Сфинкса", icon: "💎", rarity: "Легендарный", type: "legendary", value: 1000, chance: 0.03 }
    ];

    // Генерируем игровое поле
    function initGrid() {
      const grid = document.getElementById('grid');
      grid.innerHTML = '';

      for (let i = 0; i < gridSize; i++) {
        const cell = document.createElement('div');
        cell.classList.add('cell');
        cell.dataset.index = i;
        cell.onclick = () => digCell(cell);
        grid.appendChild(cell);
      }
    }

    // Логика копания клетки
    function digCell(cell) {
      if (cell.classList.contains('dug')) return;

      if (energy <= 0) {
        alert("Закончилась энергия! Подождите или очистите поле.");
        return;
      }

      // Тратим энергию
      energy--;
      updateUI();

      // Виброотклик для Telegram
      if (tg && tg.HapticFeedback) {
        tg.HapticFeedback.impactOccurred('medium');
      }

      cell.classList.add('dug');

      // Выбивание лута с помощью генератора случайных чисел
      const item = getRandomLoot();
      cell.innerHTML = item.icon;
      cell.classList.add(`item-${item.type}`);

      // Начисляем монеты и показываем окно
      coins += item.value;
      updateUI();
      showModal(item);
    }

    // Алгоритм выбора предмета по шансу
    function getRandomLoot() {
      const rand = Math.random();
      let cumulative = 0;

      for (const item of lootTable) {
        cumulative += item.chance;
        if (rand <= cumulative) {
          return item;
        }
      }
      return lootTable[0];
    }

    // Обновление показателей UI
    function updateUI() {
      document.getElementById('coins').innerText = coins;
      document.getElementById('energy').innerText = `${energy}/${maxEnergy}`;
    }

    // Показ модального окна находки
    function showModal(item) {
      document.getElementById('modal-icon').innerText = item.icon;
      document.getElementById('modal-title').innerText = item.name;
      document.getElementById('modal-rarity').innerText = item.rarity;
      document.getElementById('modal-rarity').style.color = getRarityColor(item.type);
      document.getElementById('modal-value').innerText = item.value;
      document.getElementById('modal').style.display = 'flex';
    }

    function closeModal() {
      document.getElementById('modal').style.display = 'none';
    }

    function getRarityColor(type) {
      switch(type) {
        case 'common': return '#a4b0be';
        case 'rare': return '#1e90ff';
        case 'epic': return '#a55eea';
        case 'legendary': return '#ffa502';
        default: return '#fff';
      }
    }

    // Перезапуск поля
    function resetGrid() {
      energy = maxEnergy;
      updateUI();
      initGrid();
    }

    // Авто-восстановление энергии раз в 10 секунд
    setInterval(() => {
      if (energy < maxEnergy) {
        energy++;
        updateUI();
      }
    }, 10000);

    // Старт игры
    initGrid();
  </script>
</body>
</html>
